[fetch]
# Notion 페이지 제목을 최상위 페이지부터 허용 루트까지 순서대로 나열한 경로다.
# ["팀 스페이스", "캣봇"]는 최상위 "팀 스페이스" 페이지 아래의 "캣봇" 페이지를 허용 루트로 지정한다.
# "캣봇" 자체와 그 하위 페이지만 허용하며, "팀 스페이스"이나 "캣봇"의 형제 페이지는 허용하지 않는다.
# 파일 시스템 경로나 독립적으로 허용할 페이지 목록이 아니다. 빈 배열은 객체 접근을 거부한다.
root_path = ["팀 스페이스", "캣봇"]

# root_path의 마지막 페이지(이 예에서는 "캣봇")의 UUID다. 검색마다 경로와 대조한다.
root_id = "3ce03c2c8f5080e690cbc33b94ed55c5"
